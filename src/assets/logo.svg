<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminator New Lens logo">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff5a3c"/>
      <stop offset="45%" stop-color="#e11900"/>
      <stop offset="100%" stop-color="#5a0700"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b2f"/>
      <stop offset="100%" stop-color="#8a0f00"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0a0a0c"/>
  <rect x="8" y="8" width="496" height="496" rx="90" fill="none" stroke="#1c1c22" stroke-width="2"/>

  <!-- scanline field -->
  <g opacity="0.08" stroke="#ff3b2f" stroke-width="2">
    <line x1="60" y1="120" x2="452" y2="120"/>
    <line x1="60" y1="160" x2="452" y2="160"/>
    <line x1="60" y1="352" x2="452" y2="352"/>
    <line x1="60" y1="392" x2="452" y2="392"/>
  </g>

  <!-- targeting reticle -->
  <g stroke="url(#ringGrad)" stroke-width="4" fill="none" opacity="0.9">
    <circle cx="256" cy="248" r="150" stroke-dasharray="40 24"/>
    <circle cx="256" cy="248" r="120"/>
  </g>
  <g stroke="#ff3b2f" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="70" x2="256" y2="110"/>
    <line x1="256" y1="386" x2="256" y2="426"/>
    <line x1="78" y1="248" x2="118" y2="248"/>
    <line x1="394" y1="248" x2="434" y2="248"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#ff3b2f" stroke-width="5" fill="none" opacity="0.85">
    <path d="M126 138 h-28 v28"/>
    <path d="M386 138 h28 v28"/>
    <path d="M126 358 h-28 v-28"/>
    <path d="M386 358 h28 v-28"/>
  </g>

  <!-- the machine eye / lens -->
  <circle cx="256" cy="248" r="86" fill="#120202" stroke="#3a0a05" stroke-width="6"/>
  <circle cx="256" cy="248" r="62" fill="url(#eyeGlow)" filter="url(#soft)"/>
  <circle cx="256" cy="248" r="24" fill="#1a0300"/>
  <circle cx="236" cy="228" r="10" fill="#ffd3c8" opacity="0.85"/>
  <!-- iris blades -->
  <g stroke="#ff8a75" stroke-width="2" opacity="0.5">
    <line x1="256" y1="188" x2="256" y2="308"/>
    <line x1="196" y1="248" x2="316" y2="248"/>
    <line x1="214" y1="206" x2="298" y2="290"/>
    <line x1="298" y1="206" x2="214" y2="290"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="452" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="40" letter-spacing="8" fill="#ff3b2f">TERMINATOR</text>
  <text x="256" y="484" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="20" letter-spacing="14" fill="#8a8a92">NEW LENS</text>
</svg>
